[project]
name = "ocsllmanswerer-refined"
version = "0.1.0"
description = "Local OCS AI answer server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "litellm>=1.0.0",
    "pydantic-settings>=2.6.0",
    "rich>=15.0.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "ty>=0.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".codex", ".trellis", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ty.environment]
python-version = "3.13"
root = ["."]

[tool.ty.src]
include = ["app", "tests", "main.py"]
